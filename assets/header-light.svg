<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Where rules become games</title>
<desc id="desc">Enric Pedrico’s header featuring a board, playing cards and a network of decisions.</desc>
<defs>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#204B40" opacity=".16"/></pattern>
</defs>
